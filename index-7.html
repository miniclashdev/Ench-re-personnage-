<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enchères de persos</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#14101f;--card:#211a33;--tx:#fff6e6;--mut:#a89bc4;--ac:#ffb020;--ln:#3a2f57}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
#app{max-width:460px;margin:auto;padding:16px 0 30px;display:flex;flex-direction:column;gap:12px}
h1{font-size:30px;text-align:center;letter-spacing:-.5px}
.c{background:var(--card);border-radius:18px;padding:14px;border:2px solid var(--ln)}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
button{border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:800;background:var(--ac);color:#1a1200;width:100%;font-family:inherit}
button:active{transform:scale(.97)}button.s{background:var(--ln);color:var(--tx)}button:disabled{opacity:.3}
.row{display:flex;gap:8px}.row>*{flex:1}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.big{font-size:70px;text-align:center;line-height:1.1}.nm{font-size:30px;font-weight:900;text-align:center}
.bid{font-size:34px;font-weight:900;text-align:center;margin-top:6px}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}
.t{border-left:6px solid;padding:2px 0 2px 10px;margin:8px 0}
.tag{display:inline-block;background:var(--ln);border-radius:8px;padding:2px 8px;margin:2px 2px 0 0;font-size:12px}
.ctr{text-align:center}.mut{color:var(--mut);font-size:14px}
.code{font-size:48px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--ac)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const TH={
"Dragon Ball":["🐉","Goku,Vegeta,Gohan,Piccolo,Krilin,Trunks,Freezer,Cell,Boo,Bulma,Beerus,Broly,Yamcha,Tenshinhan,Gotenks,Végéto,Jiren,Mr Satan,Roshi,C-18"],
"One Piece":["🏴‍☠️","Luffy,Zoro,Nami,Usopp,Sanji,Chopper,Robin,Franky,Brook,Ace,Sabo,Shanks,Barbe Blanche,Barbe Noire,Law,Kaido,Big Mom,Mihawk,Boa Hancock,Jinbe"],
"Star Wars":["⚔️","Luke,Leia,Han Solo,Chewbacca,Yoda,Obi-Wan,Dark Vador,Palpatine,Anakin,Padmé,Mace Windu,Dark Maul,Boba Fett,Din Djarin,Grogu,Ahsoka,R2-D2,C-3PO,Lando,Rey"],

"Naruto":["🍥","Naruto,Sasuke,Sakura,Kakashi,Itachi,Madara,Jiraya,Tsunade,Orochimaru,Gaara,Minato,Hinata,Rock Lee,Pain,Obito,Neji,Shikamaru,Kisame,Deidara,Boruto"],
"Marvel":["🦸","Iron Man,Captain America,Thor,Hulk,Black Widow,Spider-Man,Doctor Strange,Black Panther,Thanos,Loki,Deadpool,Wolverine,Captain Marvel,Hawkeye,Ant-Man,Groot,Star-Lord,Vision,Wanda,Magneto"],
"Harry Potter":["🪄","Harry,Hermione,Ron,Dumbledore,Rogue,Voldemort,Hagrid,Sirius,Drago,Luna,Neville,McGonagall,Bellatrix,Fred,George,Dobby,Lupin,Ginny,Cédric,Fol Œil"],
"Football":["⚽","Mbappé,Messi,Ronaldo,Zidane,Neymar,Haaland,Pelé,Maradona,Ronaldinho,Henry,Benzema,Modric,Lewandowski,Salah,Griezmann,De Bruyne,Cruyff,Iniesta,Xavi,Platini"],
"Mario":["🍄","Mario,Luigi,Peach,Bowser,Yoshi,Toad,Wario,Waluigi,Donkey Kong,Daisy,Rosalina,Bowser Jr,Diddy Kong,Birdo,Kamek"],
"Demon Slayer":["🗡️","Tanjiro,Nezuko,Zenitsu,Inosuke,Giyu,Shinobu,Rengoku,Tengen,Muichiro,Mitsuri,Obanai,Gyomei,Sanemi,Muzan,Akaza,Doma,Kokushibo,Daki,Gyutaro,Kanao"],
"My Hero Academia":["💥","Deku,Bakugo,Todoroki,Uraraka,Iida,All Might,Endeavor,Hawks,Shigaraki,Dabi,Toga,Aizawa,Mirio,Tsuyu,Kirishima,Momo,Overhaul,All For One,Mineta,Jiro"],
"L'Attaque des Titans":["🛡️","Eren,Mikasa,Armin,Levi,Erwin,Hansi,Reiner,Annie,Bertholdt,Jean,Connie,Sasha,Historia,Zeke,Titan Colossal,Titan Bestial,Falco,Gabi,Grisha,Kenny"],
"Jujutsu Kaisen":["👁️","Yuji,Megumi,Nobara,Gojo,Sukuna,Nanami,Maki,Toge,Panda,Geto,Mahito,Jogo,Hanami,Choso,Todo,Yuta,Toji,Kenjaku,Yuki,Mei Mei"],
"Bleach":["💀","Ichigo,Rukia,Renji,Byakuya,Uryu,Chad,Orihime,Kenpachi,Aizen,Gin,Tosen,Yoruichi,Urahara,Toshiro,Grimmjow,Ulquiorra,Yhwach,Yamamoto,Soi Fon,Mayuri"],
"Hunter x Hunter":["🎣","Gon,Kirua,Kurapika,Leorio,Hisoka,Chrollo,Meruem,Netero,Illumi,Kite,Feitan,Nobunaga,Biscuit,Killua Zoldyck,Pitou,Knuckle,Morel,Shoot,Kaito,Ging"],
"Fullmetal Alchemist":["⚗️","Edward,Alphonse,Winry,Roy Mustang,Riza,Hohenheim,Scar,Envy,Gluttony,Lust,Greed,Pride,Wrath,Ling,Olivier,Alex Armstrong,Maes Hughes,Father,Izumi,May"],
"Spy x Family":["🕶️","Loid,Yor,Anya,Bond,Franky,Yuri,Becky,Damian,Fiona,Sylvia,Henderson,Nightfall,Camilla,Millie,Sherlock,Donovan Desmond,Dominic,Ewen,Emile,Lloyd"],
"Disney":["🏰","Mickey,Minnie,Donald,Dingo,Simba,Nala,Elsa,Anna,Olaf,Aladdin,Jasmine,Génie,Ariel,Belle,Cendrillon,Blanche-Neige,Stitch,Mulan,Hercule,Baloo"],
"Pixar":["🧸","Woody,Buzz,Nemo,Dory,Marlin,Sulley,Bob,Flash McQueen,Mater,Wall-E,Eve,Rémy,Joy,Tristesse,Carl,Russell,Mérida,Miguel,Violet,Syndrome"],
"Le Seigneur des Anneaux":["💍","Frodon,Sam,Gandalf,Aragorn,Legolas,Gimli,Boromir,Gollum,Sauron,Saroumane,Bilbo,Galadriel,Elrond,Théoden,Éowyn,Faramir,Merry,Pippin,Smaug,Thorin"],
"Game of Thrones":["🐺","Jon Snow,Daenerys,Tyrion,Cersei,Jaime,Arya,Sansa,Bran,Ned Stark,Joffrey,Hodor,Brienne,Le Limier,La Montagne,Littlefinger,Varys,Melisandre,Khal Drogo,Theon,Roi de la Nuit"],
"Zelda":["🧝","Link,Zelda,Ganondorf,Midona,Navi,Epona,Impa,Sidon,Mipha,Daruk,Revali,Urbosa,Tingle,Skull Kid,Majora,Fi,Ghirahim,Vaati,Linebeck,Saria"],
"Sonic":["💨","Sonic,Tails,Knuckles,Amy,Shadow,Eggman,Rouge,Silver,Blaze,Cream,Metal Sonic,Big,Vector,Espio,Charmy,Jet,Omega,Chaos,Infinite,Mighty"],
"Minecraft":["⛏️","Steve,Alex,Creeper,Enderman,Zombie,Squelette,Wither,Ender Dragon,Villageois,Golem de fer,Cochon,Poule,Araignée,Blaze,Ghast,Piglin,Warden,Axolotl,Shulker,Herobrine"],
"Yu-Gi-Oh!":["🃏","Yugi,Kaiba,Joey,Tea,Tristan,Pegasus,Marik,Bakura,Dark Magician,Blue-Eyes,Exodia,Slifer,Obelisk,Râ,Kuriboh,Jaden,Yusei,Atem,Mokuba,Duke"],
"Les Simpson":["🍩","Homer,Marge,Bart,Lisa,Maggie,Moe,Ned Flanders,Mr Burns,Smithers,Krusty,Apu,Milhouse,Nelson,Ralph,Chef Wiggum,Grand-père,Patty,Barney,Skinner,Itchy"],
"DC Comics":["🦇","Batman,Superman,Wonder Woman,Flash,Aquaman,Green Lantern,Cyborg,Joker,Harley Quinn,Lex Luthor,Robin,Batgirl,Catwoman,Darkseid,Shazam,Supergirl,Deathstroke,Bane,Pingouin,Green Arrow"],
"NBA":["🏀","Michael Jordan,LeBron James,Kobe Bryant,Stephen Curry,Shaquille O'Neal,Magic Johnson,Larry Bird,Kevin Durant,Giannis,Nikola Jokic,Wembanyama,Luka Doncic,Tim Duncan,Allen Iverson,Dirk Nowitzki,Tony Parker,Dwyane Wade,Kawhi Leonard,Hakeem Olajuwon,Wilt Chamberlain"],
"Formule 1":["🏎️","Hamilton,Verstappen,Schumacher,Senna,Prost,Alonso,Vettel,Leclerc,Norris,Piastri,Russell,Sainz,Raikkonen,Hakkinen,Lauda,Gasly,Ocon,Perez,Button,Mansell"],
"Rap FR":["🎤","Booba,Jul,PNL,Nekfeu,SCH,Ninho,Orelsan,Damso,Gims,Soprano,Lacrim,Niska,Kaaris,Vald,Lomepal,Freeze Corleone,Tiakola,Gazo,Hamza,Naps"],
"Animaux":["🦁","Lion,Éléphant,Tigre,Gorille,Requin,Aigle,Loup,Ours,Panda,Dauphin,Girafe,Crocodile,Panthère,Rhinocéros,Hippopotame,Pieuvre,Kangourou,Pingouin,Cheval,Renard"],
"Friends":["☕","Rachel,Ross,Monica,Chandler,Joey,Phoebe,Gunther,Janice,Mike,Emily,Carol,Susan,Ben,Marcel,Richard,Tag,Estelle,Mr Heckles,Ursula,Frank"],
"Perso (ma liste)":["✨",""]};
const COL=['#ff5d5d','#4da3ff','#ffd24d','#4dd68c'];
let peer,conns={},conn,isHost=false,S=null,myId='H',code='',myName='',tOut;
const M=n=>n+' M';
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Écrans locaux ---------- */
function home(){$('#app').innerHTML=`<h1>🔨 Enchères de persos</h1>
<div class="c"><label>Ton pseudo</label><input id="nm" maxlength="14" placeholder="Pseudo" value="${myName}"></div>
<button onclick="setup()">Créer une partie</button>
<div class="c"><label>Ou rejoins avec un code</label><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase;text-align:center;font-size:24px;letter-spacing:6px"></div>
<button class="s" onclick="join()">Rejoindre</button>`}
function nameOk(){myName=$('#nm').value.trim();if(!myName){alert('Mets un pseudo');return false}return true}
function setup(){if(!nameOk())return;$('#app').innerHTML=`<h1>Réglages</h1><div class="c">
<label>Thème</label><select id="th" onchange="$('#cu').style.display=this.value.startsWith('Perso')?'block':'none'">${Object.keys(TH).map(k=>`<option>${k}</option>`)}</select>
<textarea id="cu" rows="3" style="display:none;margin-top:8px" placeholder="Noms séparés par des virgules"></textarea>
<div class="row"><div><label>Équipes</label><select id="nt"><option>2<option>3<option>4</select></div>
<div><label>Persos / équipe</label><input id="sz" type="number" value="3" min="1" max="10"></div></div>
<div class="row"><div><label>Argent (M)</label><input id="bu" type="number" value="100" min="1"></div>
<div><label>Palier (M)</label><input id="st" type="number" value="5" min="1"></div></div>
<label>Temps par enchère (secondes)</label><input id="tm" type="number" value="12" min="5" max="60"></div>
<button onclick="create()">Créer le salon</button><button class="s" onclick="home()">Retour</button>`}

/* ---------- Réseau ---------- */
function create(){
 const th=$('#th').value;
 let chars=th.startsWith('Perso')?$('#cu').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean):TH[th][1].split(',');
 const nt=+$('#nt').value,sz=Math.max(1,+$('#sz').value||3);
 if(chars.length<nt*sz){alert('Pas assez de persos pour '+nt+' équipes de '+sz);return}
 const cfg={th,em:TH[th][0],nt,sz,bu:+$('#bu').value||100,st:+$('#st').value||5,tm:+$('#tm').value||12};
 isHost=true;myId='H';
 S={phase:'lobby',cfg,chars,code:'',players:[{id:'H',name:myName,team:-1}],teams:[],idx:0,total:0,cur:null,res:null};
 openPeer(cfg)}
function openPeer(){
 code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
 peer=new Peer('ench-'+code);
 peer.on('error',e=>{if(e.type==='unavailable-id')openPeer();else alert('Erreur réseau : '+e.type)});
 peer.on('open',()=>{S.code=code;push()});
 peer.on('connection',c=>{c.on('data',d=>onMsg(c,d));c.on('close',()=>{if(S.phase==='lobby'){S.players=S.players.filter(p=>p.id!==c.peer);push()}delete conns[c.peer]})})}
function join(){
 if(!nameOk())return;code=$('#cd').value.trim().toUpperCase();if(code.length!==4){alert('Code à 4 lettres');return}
 $('#app').innerHTML='<h1>Connexion…</h1>';
 peer=new Peer();
 peer.on('error',e=>{alert(e.type==='peer-unavailable'?'Code introuvable':'Erreur réseau : '+e.type);home()});
 peer.on('open',id=>{myId=id;conn=peer.connect('ench-'+code,{reliable:true});
  conn.on('open',()=>conn.send({t:'join',name:myName}));
  conn.on('data',d=>{if(d.t==='err'){alert(d.m);home();return}S=d.s;if(S.cur)S.cur.end=Date.now()+S.cur.rem;render()});
  conn.on('close',()=>{alert('Connexion perdue');location.reload()})})}
function push(){
 const out=JSON.parse(JSON.stringify(S));if(out.cur)out.cur.rem=S.cur.end-Date.now();
 Object.values(conns).forEach(c=>c.open&&c.send({t:'s',s:out}));render()}
function act(t,m){if(isHost)handle('H',t,m);else conn.send({t,m})}
function onMsg(c,d){
 if(d.t==='join'){if(S.phase!=='lobby'){c.send({t:'err',m:'La partie a déjà commencé'});return}
  conns[c.peer]=c;if(!S.players.find(p=>p.id===c.peer))S.players.push({id:c.peer,name:String(d.name).slice(0,14),team:-1});push()}
 else handle(c.peer,d.t,d.m)}

/* ---------- Logique (hôte) ---------- */
const myTeam=id=>{const p=S.players.find(p=>p.id===id);return p?p.team:-1};
function handle(id,t,m){
 if(t==='team'&&S.phase==='lobby'){S.players.find(p=>p.id===id).team=m;push()}
 else if(S.phase==='auction'){const i=myTeam(id);if(i<0)return;t==='bid'?doBid(i,m):doPass(i)}}
function start(){
 const c=S.cfg;S.teams=Array.from({length:c.nt},(_,i)=>({money:c.bu,roster:[],on:S.players.some(p=>p.team===i)}));
 S.queue=shuffle(S.chars);S.total=S.queue.length;S.idx=0;S.turn=-1;next()}
function next(){
 const c=S.cfg;
 if(S.idx>=S.total||S.teams.every(t=>!t.on||t.roster.length>=c.sz)){S.phase='end';S.cur=null;push();return}
 S.phase='auction';
 for(let k=1;k<=c.nt;k++){const j=(S.turn+k)%c.nt;if(S.teams[j].on&&S.teams[j].roster.length<c.sz){S.turn=j;break}}
 S.cur={turn:S.turn,name:S.queue[S.idx++],bid:0,leader:-1,passed:S.teams.map(t=>!t.on||t.roster.length>=c.sz),end:Date.now()+c.tm*1000};
 push();checkEnd()}
function doBid(i,k){
 const c=S.cur,st=S.cfg.st*k,nb=c.bid+st;
 if(c.passed[i]||c.leader===i||S.teams[i].money<nb)return;
 c.bid=nb;c.leader=i;c.end=Date.now()+S.cfg.tm*1000;push();checkEnd()}
function doPass(i){const c=S.cur;if(c.leader===i||(c.leader<0&&c.turn===i))return;c.passed[i]=true;push();checkEnd()}
function checkEnd(){
 const c=S.cur;if(S.phase!=='auction')return;
 const o=c.leader>=0?c.leader:c.turn;
 if(S.teams.every((t,i)=>i===o||c.passed[i]||t.money<c.bid+S.cfg.st))closeBid()}
function closeBid(){
 const c=S.cur;
 const w=c.leader>=0?c.leader:c.turn;const t=S.teams[w];t.money-=c.bid;t.roster.push(c.name);
 S.res={name:c.name,team:w,bid:c.bid};S.phase='sold';push();
 clearTimeout(tOut);tOut=setTimeout(next,3200)}
setInterval(()=>{if(isHost&&S&&S.phase==='auction'&&Date.now()>S.cur.end)closeBid()},250);
setInterval(()=>{if(S&&S.phase==='auction'&&$('#tb')){const r=Math.max(0,S.cur.end-Date.now());$('#tb').style.width=r/(S.cfg.tm*10)+'%';$('#tt').textContent=Math.ceil(r/1000)+' s'}},150);

/* ---------- Affichage ---------- */
const tn=i=>`<b style="color:${COL[i]}">Équipe ${i+1}</b>`;
function render(){
 if(!S)return;const my=myTeam(myId);
 $('#app').innerHTML=S.phase==='lobby'?lobby(my):S.phase==='end'?endV():game(my)}
function lobby(my){const c=S.cfg;
 return `<h1>${c.em} ${c.th}</h1><div class="c"><div class="mut ctr">Code du salon</div><div class="code">${S.code||'…'}</div>
 <div class="mut ctr">${c.nt} équipes · ${c.sz} persos · ${M(c.bu)} · palier ${M(c.st)}</div></div>
 ${Array.from({length:c.nt},(_,i)=>`<div class="c t" style="border-color:${COL[i]}"><div>${tn(i)}</div>
 <div style="margin:6px 0">${S.players.filter(p=>p.team===i).map(p=>`<span class="tag">${p.name}</span>`).join('')||'<span class="mut">Personne</span>'}</div>
 <button class="${my===i?'':'s'}" onclick="act('team',${i})">${my===i?'✔ Tu es ici':'Rejoindre'}</button></div>`).join('')}
 ${isHost?`<button ${new Set(S.players.map(p=>p.team).filter(t=>t>=0)).size<2?'disabled':''} onclick="start()">Lancer les enchères</button><div class="mut ctr">Il faut au moins 2 équipes avec des joueurs</div>`:'<div class="mut ctr">En attente de l’hôte…</div>'}`}
function game(my){
 const c=S.cur,cf=S.cfg,T=S.teams;let card;
 if(S.phase==='auction'){
  const lead=c.leader>=0?`${M(c.bid)} <div class="mut" style="font-size:15px">${tn(c.leader)} mène</div>`:`<span class="mut" style="font-size:18px">Aucune enchère<br>${tn(c.turn)} l’aura sinon</span>`;
  card=`<div class="big">${cf.em}</div><div class="nm">${c.name}</div><div class="bid">${lead}</div>
  <div class="bar"><i id="tb"></i></div><div class="ctr mut" id="tt"></div>`}
 else{const r=S.res;card=`<div class="big">🎉</div><div class="nm">${r.name}</div>
  <div class="bid" style="font-size:22px">${r.bid?`Vendu à ${tn(r.team)} pour ${M(r.bid)} !`:`${tn(r.team)} le prend gratuitement (son tour)`}</div>`}
 let btn='';
 if(S.phase==='auction'){
  if(my<0)btn='<div class="mut ctr">Tu regardes</div>';
  else{const lead=c.leader===my,pa=c.passed[my],full=T[my].roster.length>=cf.sz;
   const ok=k=>!pa&&!lead&&T[my].money>=c.bid+cf.st*k;
   btn=`<div class="ctr mut">${lead?'Tu mènes !':(c.leader<0&&c.turn===my)?'C’est ton tour : il est à toi si personne n’enchérit':pa?(full?'Équipe complète':'Tu as passé'):''}</div>
   <div class="row"><button ${ok(1)?'':'disabled'} onclick="act('bid',1)">+${cf.st} M</button><button ${ok(5)?'':'disabled'} onclick="act('bid',5)">+${cf.st*5} M</button></div>
   <button class="s" ${pa||lead||(c.leader<0&&c.turn===my)?'disabled':''} onclick="act('pass')">Je passe</button>`}}
 return `<div class="ctr mut">${cf.em} ${cf.th} · perso ${S.idx}/${S.total}</div><div class="c">${card}</div>${btn}`+
 T.map((t,i)=>t.on?`<div class="c t" style="border-color:${COL[i]};${i===my?'background:#2d2347':''}"><div class="row" style="justify-content:space-between"><span>${tn(i)}${i===my?' (toi)':''}</span><b style="text-align:right">${M(t.money)}</b></div>
 <div>${t.roster.map(r=>`<span class="tag">${r}</span>`).join('')||'<span class="mut">Aucun perso</span>'} <span class="mut">${t.roster.length}/${cf.sz}</span></div></div>`:'').join('')}
function endV(){
 return `<h1>🎉 Fin des enchères !</h1>`+S.teams.map((t,i)=>t.on?`<div class="c t" style="border-color:${COL[i]}"><div>${tn(i)}</div>
 <div style="margin-top:6px">${t.roster.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`:'').join('')+`<button onclick="location.reload()">Nouvelle partie</button>`}
home();
</script></body></html>
